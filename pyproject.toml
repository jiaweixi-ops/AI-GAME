[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-autonomous-agent-lite"
version = "0.2.3"
description = "V0/V0.5 verified execution and batch-construction kernel for an event-driven Factorio AI controller"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gar-ai = "gar_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
